[package]
name = "shared_dx"
version = "0.1.0"
authors = ["John Quigley <jmquigs@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["libloaderapi", "d3d9", "d3d11", "objidlbase",
    "processthreadsapi", "memoryapi", "winerror", "winuser", "winreg",
    "dinput"] }

[dependencies]
lazy_static = "*"
fnv = "1.0.6"

[features]
# See hook_core's snapshot-dynamic-buffers feature; this adds the Map/Unmap/UpdateSubresource
# function pointers to HookDirect3D11Context.  That struct is Copy and is returned by value on
# every draw call, so the fields are kept out of the default build.  Enabled transitively by
# hook_core and hook_snapshot's features of the same name.
snapshot-dynamic-buffers = []